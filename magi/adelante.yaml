# ═══════════════════════════════════════════════════════════
# ADELANTE — Sub-Architecture Under NERV Operations
# ═══════════════════════════════════════════════════════════

name: Adelante
version: 2.1.0
parent: NERV / Operations (Misato)
description: >
  Adelante is the Commander's operational reality — the company he runs
  in Costa Rica. This sub-architecture deepens NERV Operations with the
  specific structural understanding needed to think well about Adelante
  as it actually is.

  Adelante is not a construction company that grew. Adelante is a
  vertically-integrated industrial holding building a generational
  walkable-city project (Ciudad del Valle), with vivienda as the lead
  product and progressive process absorption as the strategic operating
  principle.

# ═══════════════════════════════════════════════════════════
# ARCHITECTURE PATTERN — Parallel Estado / Evolución
# ═══════════════════════════════════════════════════════════
# Each analytical domain has parallel files:
#
#   estado:    "Cómo es" — descriptive substrate. What exists, what is
#              in operation, the current configuration. Encyclopedic
#              register. Updated as substrate accumulates from sessions.
#
#   evolución: "Bajo qué marco evoluciona" — prescriptive substrate.
#              Principles, references, decision criteria, the lens
#              applied when evolving the organization or the product.
#
# The two co-evolve: evolución guides the next chapter of estado;
# estado refines and corrects evolución when reality contradicts it.
#
# The Plataforma dimension uses a slight variation: estado pairs with
# a technical companion (stack_architecture) and its prescriptive
# evolución file is pending until substrate accumulates.

architecture_pattern:
  estado_files:
    register: "Encyclopedic, descriptive, observational"
    function: "Capture Adelante as it actually is, with explicit prompts where substrate is thin"
    update_cadence: "As observations accumulate from sessions"

  evolucion_files:
    register: "Prescriptive, principle-driven, reference-rich"
    function: "Articulate the design discipline for evolving organization and product"
    update_cadence: "When new analytical apparatus is recognized as load-bearing"

  technical_companion_files:
    register: "Operating reference for technical decisions"
    function: "Capture architectural pattern, inventory, boundaries"
    update_cadence: "As decisions evolve"

# ═══════════════════════════════════════════════════════════
# CATEGORICAL FRAMING
# ═══════════════════════════════════════════════════════════

categorical_frame:
  what_adelante_is_not:
    - "A construction company scaling up"
    - "A real estate developer with a portfolio of projects"
    - "A diversified industrial group with multiple verticals"
    - "A software-style growth company with network effects"

  what_adelante_is:
    primary: "A developer-operator of Ciudad del Valle"
    secondary: "A vertically-integrated industrial system that produces vivienda as its lead product"
    horizon: "Multi-generational — 5,000+ solutions at 2/week per cuadrilla puts the project at decadal scale"
    strategic_logic: >
      Surplus utility absorbs adjacent processes. Each vertical absorption
      deepens the moat around a single project rather than diversifying
      into parallel businesses. The opposite of conglomerate logic.

  why_the_distinction_matters:
    - "Growth-company frameworks (Hacking Growth, Blitzscaling) are largely irrelevant"
    - "Construction-company frameworks miss the integration logic"
    - "Conglomerate frameworks miss the focus discipline (no external verticals)"
    - "The relevant comparables are city-companies and walkable-city developments"
    - "Decisions five years out are about urban operation, not just building velocity"

# ═══════════════════════════════════════════════════════════
# STRUCTURE
# ═══════════════════════════════════════════════════════════

files:
  base:
    path: adelante_base.md
    register: foundational
    function: >
      Conceptual foundation shared across the entire sub-architecture.
      Categorical frame, structural principles, the developer-operator-
      of-Ciudad-del-Valle definition. Read first when establishing context.

  operacional_estado:
    path: adelante_operacional_estado.md
    register: descriptive
    function: >
      How Adelante's productive system actually runs today. Two-tempo
      problem and its current solution, complete 12-station cuadrilla
      chain, molécula concept (proprietary scaling primitive),
      horizontal services, Tres Amigos ritual with sprint vocabulary,
      ultra-actividad as budget-production bridge, vertical integration
      inventory, demand-following capacity (not static throughput),
      upstream quality as structural property.

  operacional_evolucion:
    path: adelante_operacional_evolucion.md
    register: prescriptive
    function: >
      The design discipline for evolving the productive system. Theory
      of Constraints applied to the full chain, Pace Layers for capability
      portfolio, Wardley Mapping for component maturity, principles of
      absorption decisions, automation roadmap logic.

  organizacional_estado:
    path: adelante_organizacional_estado.md
    register: descriptive
    function: >
      Adelante's organizational reality today. 330 total headcount with
      Campo/Oficina/Comercio split, Dunbar band 150-500 as binding,
      4:1 asymmetry as structural property, five poroso sovereignties
      at executive layer (father + four siblings), maestros de obra
      intermediate layer, Plataforma as distinct dimension, ritual
      inventory (Tres Amigos, Scrum), friction surfaces with absence
      of cross-management coordination as central.

  organizacional_evolucion:
    path: adelante_organizacional_evolucion.md
    register: prescriptive
    function: >
      The design discipline for evolving organizational structure as
      Adelante scales. The Dunbar / free-riding / tribal duality as the
      central organizing problem. Ostrom on nested governance, McChrystal
      on team-of-teams, Laloux on interface roles, the Schultz/Sinek
      cultural-identity toolkit and its limits at scale.

  ciudad_del_valle_estado:
    path: adelante_ciudad_del_valle_estado.md
    register: descriptive
    function: >
      Ciudad del Valle as the project currently exists in plan and partial
      execution. Located in Sabana Grande de Cartago. Scale, scope, the
      mixed-use ambition, commercial already operating (9Round + Pops),
      current phase status, what has been built, what is planned next.

  ciudad_del_valle_evolucion:
    path: adelante_ciudad_del_valle_evolucion.md
    register: prescriptive
    function: >
      The design discipline for evolving Ciudad del Valle as product and
      project. Poundbury as primary comparable, the community-formation
      apparatus (Christakis, Schwartz, Noah), the urbanism literature
      (Alexander, Jacobs, Gehl, Marohn), post-delivery operator question
      (already active at small scale), succession architecture.

  plataforma_estado:
    path: adelante_plataforma_estado.md
    register: descriptive
    function: >
      The team that builds Adelante's internal software (H4, B0, A3, V5).
      Five people including the Commander as advisor. Daniel (brother)
      as team lead and primary builder via AI-assisted vibe coding.
      Located inside Ciudad del Valle's commercial parcel. Scrum classic
      cadence. Sequential build. Risk surfaces specific to this
      configuration (library erosion, structural memory concentration,
      advisor-vs-constructor protocol).

  plataforma_companion:
    path: adelante_stack_architecture.md
    register: technical_operating_reference
    function: >
      The constellation pattern. Standalone Next.js apps over shared
      substrate (component library, Auth.js/Entra ID, Business Central +
      Azure SQL data layer, shared domain types). Boundaries that must
      hold against fragmentation and against monolith collapse. App
      inventory with H4 first. Build sequence. PPC and miss reason
      codes as A3 instrumentation.

  plataforma_evolucion:
    path: adelante_plataforma_evolucion.md
    status: pending
    function: >
      Prescriptive principles for evolving the platform team and its
      output. Will be written when sufficient substrate accumulates —
      governance principles, team growth thresholds, AI-tooling policy,
      cross-team integration discipline, succession of architectural
      memory.

