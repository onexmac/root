# ═══════════════════════════════════════════════════════════
# DESIGN PRINCIPLES
# ═══════════════════════════════════════════════════════════

principles:
  - "Adelante is the developer-operator of Ciudad del Valle. The vertical integration serves that, not the other way around."
  - "Surplus utility absorbs adjacent processes. No external verticals."
  - "Vivienda is the lead product, not the only product — the city is the product."
  - "Industrial integration is moat-deepening, not diversification."
  - "Production runs at takt time; cuadrillas are stations in a synchronized line."
  - "Capacity is demand-following with elasticity by layers (molécula → cuadrilla → vertical), not static throughput."
  - "Capital propio buffers commercial-production tempo mismatch — eliminating mura is worth the financial cost."
  - "Upstream quality (~1% Reparaciones) is a scarce structural asset, not a neutral data point."
  - "The horizon is generational. Decisions today should account for who operates Adelante after the Commander."
  - "Organizational design above Dunbar scale is patch-work for a body plan evolution did not produce; the work is managing tension, not solving it."
  - "Executive layer is five poroso sovereignties (father + four siblings); coordination is emergent and family-substrate dependent."
  - "Platform team's product is categorically distinct from Adelante's main product and warrants its own analytical surface."
  - "Estado captures what is; evolución captures the discipline for evolving what is. They co-evolve."

# ═══════════════════════════════════════════════════════════
# RELATIONSHIP TO NERV
# ═══════════════════════════════════════════════════════════

nerv_integration:
  parent_branch: Operations (Misato)
  relationship: >
    Adelante is the primary operational reality covered by NERV Operations.
    Operations remains the routing entry point for general operational
    questions; the Adelante sub-architecture provides structural depth
    when the question requires understanding Adelante as it actually is.

  when_to_route_here_vs_operations:
    operations_first: >
      General operational reality, day-to-day decisions, current project
      status, people dynamics, things-that-are-happening-now questions
      where the answer is in operational context, not in structural depth.
    adelante_first: >
      Structural questions about Adelante, growth/scaling questions,
      vertical integration questions, Ciudad del Valle as a project,
      organizational design questions, framework-application questions,
      platform-team and stack-architecture questions. Within the
      sub-architecture, route to estado for state-of-things questions
      and to evolución for design-discipline questions.

# ═══════════════════════════════════════════════════════════
# VERSIONING
# ═══════════════════════════════════════════════════════════

version_history:
  v1.0: >
    Initial three-file structure (base, operacional, ciudad_del_valle).
    Categorical frame "Adelante = developer-operator of Ciudad del Valle,
    not a construction company" established.

  v1.1: >
    Ciudad del Valle layer expanded with Poundbury as primary comparable,
    community-formation thinkers (Christakis, Schwartz, Noah), New Urbanism
    network as practitioner resource.

  v2.0: >
    Architecture reorganized into parallel estado/evolución pattern.
    Three operational domains (operacional, organizacional, ciudad del
    valle), each with descriptive and prescriptive surfaces. Organizacional
    is a new dimension organized around the Dunbar/free-riding/tribal
    duality as the central organizing problem of Adelante's growth.
    Total: 1 base + 3 estado/evolución pairs = 7 content files + 1 activator.

  v2.1: >
    Plataforma added as fourth analytical dimension with estado file and
    technical companion (stack_architecture). Plataforma evolución pending.
    Organizacional and operacional estado files materially expanded with
    real headcount (330), complete cuadrilla chain (12 stations), molécula
    as proprietary scaling primitive, Tres Amigos ritual with ultra-actividad
    vocabulary, five-sibling executive layer with rotational history,
    Sabana Grande de Cartago as project location, commerce already operating
    (9Round + Pops). Total: 1 base + 3 estado/evolución pairs + 1 plataforma
    estado + 1 stack architecture = 9 content files + 1 activator.
