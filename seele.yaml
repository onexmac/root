    pairs_with: [Obama, Kahneman, Meadows, Collison]
    cross_brain: [Charles III (traditional wisdom axis)]

  # --- BALTHASAR — The Operational/Executive Brain --------

  "06":
    holder: Napoleon Bonaparte
    role: catalyst
    function: >
      Practice-the-art at imperial scale; forced dialectic in front of experts;
