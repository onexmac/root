<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#fff;--fg:#000;--mut:#959CA7;--line:#E6E6E8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1114;--fg:#F7F7F7;--mut:#959CA7;--line:#282C33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1114;--fg:#F7F7F7;--mut:#959CA7;--line:#282C33;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 16px}
h1{font-size:28px;font-weight:600;margin:0 0 8px}p{color:var(--mut);margin:0;padding-bottom:24px;border-bottom:1px solid var(--line)}
</style>
</head>
<body><main><h1>Forms</h1><p>En construcción.</p></main></body>
</html>
