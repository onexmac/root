fill="#8fa3cc" text-anchor="middle" font-weight="500" >no siempre gana el dominante</text><rect x="60" y="240" width="880" height="150" rx="20" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="90" y="286" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#35e6ff" text-anchor="start" font-weight="700" >Dominancia completa</text><text x="90" y="362" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >el heterocigoto se ve igual que el dominante — Aa se ve como AA</text><rect x="60" y="422" width="880" height="150" rx="20" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="90" y="468" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#ff53c8" text-anchor="start" font-weight="700" >Dominancia incompleta</text><text x="90" y="544" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >el heterocigoto queda en el medio — flor roja × blanca da rosada</text><rect x="60" y="604" width="880" height="150" rx="20" fill="#0d1734" stroke="#66ffa6" stroke-width="3" filter="url(#g2)"/><text x="90" y="650" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#66ffa6" text-anchor="start" font-weight="700" >Codominancia</text><text x="90" y="726" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >los dos alelos se expresan enteros y a la vez — grupo sanguíneo AB</text><rect x="60" y="786" width="880" height="150" rx="20" fill="#0d1734" stroke="#ffd84d" stroke-width="3" filter="url(#g3)"/><text x="90" y="832" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#ffd84d" text-anchor="start" font-weight="700" >Alelos múltiples</text><text x="90" y="908" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >el gen tiene más de dos variantes en la población — sistema ABO</text></svg>