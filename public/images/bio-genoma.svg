<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450"><title>El Proyecto Genoma Humano</title><defs><filter id="g0" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#35e6ff" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g1" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff53c8" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#66ffa6" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g3" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ffd84d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g4" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff8a3d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="1450" fill="#070d24"/><text x="500" y="92" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#e8f0ff" text-anchor="middle" font-weight="600" >Proyecto Genoma Humano</text><text x="500" y="140" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500" >leer entero el manual de instrucciones</text><circle cx="280" cy="330" r="115" fill="none" stroke="#35e6ff" stroke-width="6" filter="url(#g0)"/><text x="280" y="345" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="52" fill="#35e6ff" text-anchor="middle" font-weight="700" >1990</text><text x="280" y="480" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#8fa3cc" text-anchor="middle" font-weight="500" >arranca</text><circle cx="720" cy="330" r="115" fill="none" stroke="#ff53c8" stroke-width="6" filter="url(#g1)"/><text x="720" y="345" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="52" fill="#ff53c8" text-anchor="middle" font-weight="700" >2003</text><text x="720" y="480" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#8fa3cc" text-anchor="middle" font-weight="500" >termina</text><line x1="400" y1="330" x2="600" y2="330" stroke="#8fa3cc" stroke-width="5" stroke-dasharray="14 12"/><rect x="60" y="540" width="880" height="300" rx="26" fill="#0d1734" stroke="#182752" stroke-width="3"/><text x="500" y="610" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#66ffa6" text-anchor="middle" font-weight="700" >3 200 millones</text><text x="500" y="655" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#8fa3cc" text-anchor="middle" font-weight="500" >de pares de bases</text><text x="500" y="740" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="40" fill="#ffd84d" text-anchor="middle" font-weight="700" >20 000 – 25 000 genes</text><text x="500" y="785" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="middle" font-weight="500" >muchos menos de los que se esperaban</text><text x="500" y="900" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#e8f0ff" text-anchor="middle" font-weight="500" >Solo una parte pequeña del genoma</text><text x="500" y="940" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#e8f0ff" text-anchor="middle" font-weight="500" >codifica proteínas; el resto regula o no codifica.</text><text x="500" y="1020" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="middle" font-weight="500" >Qué buscaba: identificar los genes, guardar la información en</text><text x="500" y="1058" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="middle" font-weight="500" >bases de datos públicas y atender los problemas éticos y legales.</text></svg>