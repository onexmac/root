<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450"><title>Los dictadores de América Latina</title><rect width="1000" height="1450" fill="#0a1512"/><text x="500" y="92" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#e8f0ff" text-anchor="middle" font-weight="600" >Los dictadores</text><text x="500" y="140" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#7f9a90" text-anchor="middle" font-weight="500" >país · nombre · años en el poder</text><rect x="60" y="195" width="880" height="104" rx="20" fill="#101f1a" stroke="#1c3630" stroke-width="2"/><text x="90" y="235" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#7fd4b8" text-anchor="start" font-weight="700" >ARGENTINA</text><text x="90" y="273" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#e8f0ff" text-anchor="start" font-weight="600" >Jorge Rafael Videla</text><text x="910" y="235" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#d96c6c" text-anchor="end" font-weight="600" >1976 – 1981</text><text x="910" y="273" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#8fa8a0" text-anchor="end" font-weight="500" >Encabezó la junta del «Proceso»; desapariciones masivas.</text><rect x="60" y="313" width="880" height="104" rx="20" fill="#101f1a" stroke="#1c3630" stroke-width="2"/><text x="90" y="353" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#7fd4b8" text-anchor="start" font-weight="700" >CHILE</text><text x="90" y="391" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#e8f0ff" text-anchor="start" font-weight="600" >Augusto Pinochet</text><text x="910" y="353" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#d96c6c" text-anchor="end" font-weight="600" >1973 – 1990</text><text x="910" y="391" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#8fa8a0" text-anchor="end" font-weight="500" >Derrocó a Allende; represión y giro neoliberal.</text><rect x="60" y="431" width="880" height="104" rx="20" fill="#101f1a" stroke="#1c3630" stroke-width="2"/><text x="90" y="471" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#7fd4b8" text-anchor="start" font-weight="700" >PARAGUAY</text><text x="90" y="509" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#e8f0ff" text-anchor="start" font-weight="600" >Alfredo Stroessner</text><text x="910" y="471" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#d96c6c" text-anchor="end" font-weight="600" >1954 – 1989</text><text x="910" y="509" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#8fa8a0" text-anchor="end" font-weight="500" >35 años: la dictadura más larga de Sudamérica.</text><rect x="60" y="549" width="880" height="104" rx="20" fill="#101f1a" stroke="#1c3630" stroke-width="2"/><text x="90" y="589" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#7fd4b8" text-anchor="start" font-weight="700" >BOLIVIA</text><text x="90" y="627" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#e8f0ff" text-anchor="start" font-weight="600" >Hugo Banzer</text><text x="910" y="589" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#d96c6c" text-anchor="end" font-weight="600" >1971 – 1978</text><text x="910" y="627" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#8fa8a0" text-anchor="end" font-weight="500" >Golpe militar; su régimen entró al Plan Cóndor.</text><rect x="60" y="667" width="880" height="104" rx="20" fill="#101f1a" stroke="#1c3630" stroke-width="2"/><text x="90" y="707" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#7fd4b8" text-anchor="start" font-weight="700" >NICARAGUA</text><text x="90" y="745" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#e8f0ff" text-anchor="start" font-weight="600" >Anastasio Somoza</text><text x="910" y="707" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#d96c6c" text-anchor="end" font-weight="600" >hasta 1979</text><text x="910" y="745" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#8fa8a0" text-anchor="end" font-weight="500" >Dinastía familiar; cayó con la revolución sandinista.</text><rect x="60" y="785" width="880" height="104" rx="20" fill="#101f1a" stroke="#1c3630" stroke-width="2"/><text x="90" y="825" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#7fd4b8" text-anchor="start" font-weight="700" >CUBA</text><text x="90" y="863" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#e8f0ff" text-anchor="start" font-weight="600" >Fidel Castro</text><text x="910" y="825" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#d96c6c" text-anchor="end" font-weight="600" >1959 – 2008</text><text x="910" y="863" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#8fa8a0" text-anchor="end" font-weight="500" >Revolución, partido único y alianza con la URSS.</text><rect x="60" y="903" width="880" height="104" rx="20" fill="#101f1a" stroke="#1c3630" stroke-width="2"/><text x="90" y="943" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#7fd4b8" text-anchor="start" font-weight="700" >VENEZUELA</text><text x="90" y="981" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#e8f0ff" text-anchor="start" font-weight="600" >Hugo Chávez</text><text x="910" y="943" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#d96c6c" text-anchor="end" font-weight="600" >1999 – 2013</text><text x="910" y="981" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#8fa8a0" text-anchor="end" font-weight="500" >Llegó por elecciones y concentró el poder en el Ejecutivo.</text><rect x="60" y="1030" width="880" height="150" rx="20" fill="#101f1a" stroke="#1c3630" stroke-width="2"/><text x="500" y="1080" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#7fd4b8" text-anchor="middle" font-weight="600" >Y tres de Centroamérica</text><text x="500" y="1126" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#e8f0ff" text-anchor="middle" font-weight="500" >Jorge Ubico · Maximiliano Hernández Martínez</text><text x="500" y="1162" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#e8f0ff" text-anchor="middle" font-weight="500" >Tiburcio Carías Andino</text></svg>