<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450"><title>Las tres leyes de Mendel</title><defs><filter id="g0" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#35e6ff" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g1" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff53c8" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#66ffa6" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g3" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ffd84d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g4" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff8a3d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="1450" fill="#070d24"/><text x="500" y="92" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#e8f0ff" text-anchor="middle" font-weight="600" >Las tres leyes de Mendel</text><text x="500" y="140" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500" >uniformidad · segregación · distribución</text><rect x="70" y="210" width="860" height="240" rx="26" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="110" y="270" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="28" fill="#35e6ff" text-anchor="start" font-weight="700" >1.ª  UNIFORMIDAD</text><text x="110" y="340" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="42" fill="#e8f0ff" text-anchor="start" font-weight="700" >AA × aa</text><text x="110" y="395" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#8fa3cc" text-anchor="start" font-weight="500" >toda la F1 es igual y heterocigota (Aa)</text><rect x="70" y="490" width="860" height="240" rx="26" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="110" y="550" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="28" fill="#ff53c8" text-anchor="start" font-weight="700" >2.ª  SEGREGACIÓN</text><text x="110" y="620" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="42" fill="#e8f0ff" text-anchor="start" font-weight="700" >Aa × Aa</text><text x="110" y="675" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#8fa3cc" text-anchor="start" font-weight="500" >los dos alelos se separan al formar gametos</text><text x="890" y="620" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="38" fill="#ff53c8" text-anchor="end" font-weight="700" >F2 → 3 : 1</text><rect x="70" y="770" width="860" height="240" rx="26" fill="#0d1734" stroke="#66ffa6" stroke-width="3" filter="url(#g2)"/><text x="110" y="830" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="28" fill="#66ffa6" text-anchor="start" font-weight="700" >3.ª  DISTRIBUCIÓN INDEPENDIENTE</text><text x="110" y="900" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="42" fill="#e8f0ff" text-anchor="start" font-weight="700" >AaBb × AaBb</text><text x="110" y="955" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#8fa3cc" text-anchor="start" font-weight="500" >los genes distintos se reparten sin estorbarse</text><text x="890" y="900" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="38" fill="#66ffa6" text-anchor="end" font-weight="700" >F2 → 9 : 3 : 3 : 1</text><text x="500" y="1075" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#8fa3cc" text-anchor="middle" font-weight="500" >3 : 1 es fenotípica · 1 : 2 : 1 es genotípica</text></svg>