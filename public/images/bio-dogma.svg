ints="500,740 487.0,714.0 513.0,714.0" fill="#e8f0ff"/><text x="690" y="700" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#e8f0ff" text-anchor="middle" font-weight="500" >traducción</text><rect x="90" y="900" width="820" height="190" rx="26" fill="#0d1734" stroke="#182752" stroke-width="3"/><text x="500" y="960" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#8fa3cc" text-anchor="middle" font-weight="500" >El ADN también se copia a sí mismo:</text><text x="500" y="1020" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="32" fill="#ffd84d" text-anchor="middle" font-weight="600" >ADN — replicación — ADN</text></svg>