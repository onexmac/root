<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450"><title>Mutación, variabilidad y selección natural</title><defs><filter id="g0" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#35e6ff" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g1" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff53c8" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#66ffa6" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g3" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ffd84d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g4" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff8a3d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="1450" fill="#070d24"/><text x="500" y="92" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#e8f0ff" text-anchor="middle" font-weight="600" >Mutación y evolución</text><text x="500" y="140" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500" >de dónde sale la variedad</text><rect x="60" y="250" width="880" height="150" rx="20" fill="#0d1734" stroke="#66ffa6" stroke-width="3" filter="url(#g2)"/><text x="90" y="296" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#66ffa6" text-anchor="start" font-weight="700" >La mutación CREA alelos nuevos</text><text x="90" y="370" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >es la única fuente original de variabilidad genética</text><rect x="60" y="428" width="880" height="150" rx="20" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="90" y="474" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#35e6ff" text-anchor="start" font-weight="700" >La reproducción sexual solo BARAJA</text><text x="90" y="548" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >recombina variantes que ya existían; no inventa ninguna</text><rect x="60" y="606" width="880" height="150" rx="20" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="90" y="652" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#ff53c8" text-anchor="start" font-weight="700" >Solo las germinales cuentan</text><text x="90" y="726" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >son las únicas que llegan a la siguiente generación</text><rect x="60" y="784" width="880" height="150" rx="20" fill="#0d1734" stroke="#ffd84d" stroke-width="3" filter="url(#g3)"/><text x="90" y="830" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#ffd84d" text-anchor="start" font-weight="700" >La selección natural FILTRA</text><text x="90" y="904" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >no dirige la mutación: elige cuáles sobreviven según el ambiente</text><rect x="60" y="1100" width="880" height="90" rx="26" fill="#0d1734" stroke="#182752" stroke-width="3"/><text x="500" y="1155" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#e8f0ff" text-anchor="middle" font-weight="500" >Anemia falciforme: dañina en homocigosis, protege de la malaria en heterocigosis.</text></svg>