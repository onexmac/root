if" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500" >qué se hace con esa información</text><rect x="60" y="230" width="880" height="148" rx="20" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="90" y="276" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#35e6ff" text-anchor="start" font-weight="700" >Diagnóstico genético</text><text x="90" y="350" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >detectar la mutación que causa una enfermedad</text><rect x="60" y="400" width="880" height="148" rx="20" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="90" y="446" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#ff53c8" text-anchor="start" font-weight="700" >Medicina predictiva</text><text x="90" y="520" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >ver la predisposición — BRCA1/BRCA2 y cáncer de mama</text><rect x="60" y="570" width="880" height="148" rx="20" fill="#0d1734" stroke="#66ffa6" stroke-width="3" filter="url(#g2)"/><text x="90" y="616" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#66ffa6" text-anchor="start" font-weight="700" >Terapia génica</text><text x="90" y="690" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >corregir o silenciar un gen; somática se permite, germinal no</text><rect x="60" y="740" width="880" height="148" rx="20" fill="#0d1734" stroke="#ffd84d" stroke-width="3" filter="url(#g3)"/><text x="90" y="786" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#ffd84d" text-anchor="start" font-weight="700" >Biofármacos</text><text x="90" y="860" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >insulina, hormona del crecimiento y vacunas hechas por organismos modificados</text><rect x="60" y="910" width="880" height="148" rx="20" fill="#0d1734" stroke="#ff8a3d" stroke-width="3" filter="url(#g4)"/><text x="90" y="956" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#ff8a3d" text-anchor="start" font-weight="700" >Farmacogenómica</text><text x="90" y="1030" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >ajustar el medicamento al perfil genético del paciente</text><rect x="60" y="1100" width="880" height="90" rx="26" fill="#0d1734" stroke="#182752" stroke-width="3"/><text x="500" y="1155" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#e8f0ff" text-anchor="middle" font-weight="500" >La herramienta de hoy es CRISPR-Cas9: corta y edita con precisión.</text></svg>