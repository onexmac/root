<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450"><title>Transición, transversión y cambio de marco</title><defs><filter id="g0" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#35e6ff" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g1" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff53c8" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#66ffa6" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g3" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ffd84d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g4" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff8a3d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="1450" fill="#070d24"/><text x="500" y="92" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#e8f0ff" text-anchor="middle" font-weight="600" >Cambios en la base</text><text x="500" y="140" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500" >transición, transversión, corrimiento</text><rect x="60" y="230" width="880" height="210" rx="22" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="90" y="285" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="28" fill="#35e6ff" text-anchor="start" font-weight="700" >TRANSICIÓN</text><text x="90" y="358" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="40" fill="#e8f0ff" text-anchor="start" font-weight="700" >A → G</text><text x="90" y="405" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >cambia por otra del MISMO tipo (purina por purina)</text><rect x="60" y="480" width="880" height="210" rx="22" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="90" y="535" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="28" fill="#ff53c8" text-anchor="start" font-weight="700" >TRANSVERSIÓN</text><text x="90" y="608" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="40" fill="#e8f0ff" text-anchor="start" font-weight="700" >A → C</text><text x="90" y="655" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >cambio radical: purina por pirimidina</text><rect x="60" y="730" width="880" height="210" rx="22" fill="#0d1734" stroke="#ffd84d" stroke-width="3" filter="url(#g3)"/><text x="90" y="785" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="28" fill="#ffd84d" text-anchor="start" font-weight="700" >CAMBIO DE MARCO</text><text x="90" y="858" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="40" fill="#e8f0ff" text-anchor="start" font-weight="700" >quita o mete una base</text><text x="90" y="905" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="500" >arruina TODO lo que viene después</text><rect x="60" y="1000" width="880" height="170" rx="26" fill="#0d1734" stroke="#182752" stroke-width="3"/><text x="500" y="1060" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#e8f0ff" text-anchor="middle" font-weight="500" >El corrimiento suele ser el más grave:</text><text x="500" y="1105" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="middle" font-weight="500" >la de sentido erróneo cambia un aminoácido,</text><text x="500" y="1143" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#ffd84d" text-anchor="middle" font-weight="500" >el corrimiento cambia todos los que siguen.</text></svg>