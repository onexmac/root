nt-size="25" fill="#8fa3cc" text-anchor="middle" font-weight="500" >porque tienen un solo cromosoma X:</text><text x="500" y="945" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#8fa3cc" text-anchor="middle" font-weight="500" >no hay un segundo que lo enmascare.</text><text x="500" y="1020" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#ffd84d" text-anchor="middle" font-weight="500" >La mujer necesita DOS copias para estar afectada.</text></svg>